name = "punchline-form-proxy"
main = "telegram-proxy.js"
compatibility_date = "2026-01-01"

[vars]
# Telegram chat that receives applications.
TELEGRAM_CHAT_ID = "-5189423412"
# Lock the proxy to the site's origins (no path), comma-separated. The github.io
# origin stays so visitors on the old address keep working until they're redirected.
ALLOWED_ORIGIN = "https://punchlineteam.com,https://www.punchlineteam.com,https://punchlineteam.github.io"

# TELEGRAM_BOT_TOKEN is NOT stored here — set it as a secret:
#   wrangler secret put TELEGRAM_BOT_TOKEN
